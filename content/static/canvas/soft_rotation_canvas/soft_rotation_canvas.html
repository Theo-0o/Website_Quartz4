<script>
(function () {
  'use strict';

  // ---- The only knobs you need — same for every future canvas ----
  var ZOOM = 0.7;          // fixed zoom level — zoom interaction is disabled below
  var X_OFFSET = 0;        // nudge left(-)/right(+) from dead-center, in canvas px
  var Y_OFFSET = 190;        // nudge up(-)/down(+) from dead-center — this is the
                            // STARTING vertical position, before any scrolling
  var SCROLL_SPEED = 1;    // vertical px moved per px of wheel deltaY — flip sign if backwards

  var canvasInstance = null;
  var lockedX = null; // computed from the content itself, never guessed

  var interval = setInterval(function () {
    if (!window.Canvas || !window.Vector2) return;
    clearInterval(interval);

    var proto = window.Canvas.prototype;
    var origScaleAround = proto.scaleAround; // captured before we disable it below

    // ---- Set the starting view: center on the content's own bounds, at ZOOM ----
    var origFit = proto.fitToBounds;
    proto.fitToBounds = function () {
      var result = origFit.apply(this, arguments);
      canvasInstance = this;

      // Rescale from whatever the plugin's own natural fit landed on, to our
      // fixed ZOOM — using its own zoom-around-a-point function (the same
      // one its wheel/pinch zoom uses) so centering math isn't re-derived,
      // it's reused from code we know already works.
      origScaleAround.call(this, ZOOM / this.targetScale, this.nodeBounds.center, true);

      if (X_OFFSET || Y_OFFSET) {
        var nudge = new window.Vector2(X_OFFSET, Y_OFFSET);
        this.targetPosition = this.targetPosition.add(nudge);
        this.position = this.position.add(nudge);
      }

      lockedX = this.position.x;
      return result;
    };

    // ---- Keep the horizontal position pinned no matter what sets it ----
    ['position', 'targetPosition'].forEach(function (prop) {
      var desc = Object.getOwnPropertyDescriptor(proto, prop);
      if (!desc || !desc.set) return;
      var origSet = desc.set;
      Object.defineProperty(proto, prop, {
        get: desc.get,
        configurable: true,
        set: function (v) {
          if (v && typeof v.y === 'number' && lockedX !== null) {
            v = new window.Vector2(lockedX, v.y);
          }
          origSet.call(this, v);
        },
      });
    });

    // ---- Disable zoom for user interaction (wheel-zoom + pinch both call this) ----
    proto.scaleAround = function () { /* zoom disabled */ };

    // ---- Block click-and-drag panning (mouse/pen). Touch is untouched. ----
    var wrapperEl = document.querySelector('.canvas-wrapper');
    if (wrapperEl) {
      wrapperEl.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' || e.pointerType === 'pen') e.stopPropagation();
      }, true);

      // ---- Trackpad/wheel scroll moves the view vertically, nothing else ----
      wrapperEl.addEventListener('wheel', function (e) {
        if (!canvasInstance || lockedX === null) return;
        var newY = canvasInstance.position.y - e.deltaY * SCROLL_SPEED;
        canvasInstance.forcePosition = new window.Vector2(lockedX, newY);
      }, { passive: true });
    }
  }, 20);
})();
